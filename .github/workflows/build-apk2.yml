name: Build APK 2
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: |
          W=.github/workflows
          mkdir -p www assets
          cp $W/index.html www/
          cp $W/icon-*.png assets/
          cp $W/package.json $W/capacitor.config.json .
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Parlez-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
